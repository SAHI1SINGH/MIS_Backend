# ─── Spring Application ───────────────────────────────────────────────────────
spring.application.name=Tadobasolutions
spring.profiles.active=dev

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── File Storage ─────────────────────────────────────────────────────────────
cert.storage.path=uploads/certificates
cert.preview.url-base=http://localhost:8080

# ─── Attendance Config (defaults — override in profile-specific files) ────────
# Late cutoff: employees marking AFTER this time (HH:mm) are flagged LATE.
# 10:05 means 10:05:00 is still PRESENT; 10:05:01+ is LATE.
attendance.late-cutoff=10:05

# Office IP whitelist: comma-separated subnet prefixes or exact IPs.
# Employees on these IPs can mark biometric attendance without a reason popup.
# Tip: find your real office IP from the log → [Attendance] Check-in: clientIp=X.X.X.X
attendance.office-ip-prefixes=152.56.161.119